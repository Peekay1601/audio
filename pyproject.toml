[project]
name = "elevenlabs-dubbing-studio-mcp"
version = "0.1.0"
description = "MCP server: Claude writes voice, sound-design and music prompts for your video; ElevenLabs generates them into a project folder."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "numpy>=1.26",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
elevenlabs-dubbing-studio = "dubbing_studio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubbing_studio_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
